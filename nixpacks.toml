[phases.setup]
nixPkgs = ["nodejs_20", "python3", "python3Packages.pip", "python3Packages.reportlab", "python3Packages.pillow"]

[phases.install]
# Railway sets NODE_ENV=production; tsx and Vite are still needed at build time.
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "NODE_ENV=production node dist/index.cjs"
